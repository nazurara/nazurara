<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee8fa"/><stop offset=".5" stop-color="#b388ff"/><stop offset="1" stop-color="#ff6fb5"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#2a1352"/>
    </linearGradient>
    <style>
      .u { font-family: 'Segoe UI', 'Yu Gothic', Arial, sans-serif; font-weight: 700; }
      .press { animation: pr 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pr { 0%,70%,100% { transform: translateY(0) } 80% { transform: translateY(3px) } }
    </style>
  </defs>
  <path d="M2 2 V60 a28 28 0 0 0 28 28 H1170 a28 28 0 0 0 28 -28 V2" fill="url(#bg)" stroke="url(#b)" stroke-width="4"/>
  <!-- d-pad -->
  <g transform="translate(70,44)">
    <rect x="-24" y="-8" width="48" height="16" rx="4" fill="#3b2470" stroke="#b388ff" stroke-width="2"/>
    <rect x="-8" y="-24" width="16" height="48" rx="4" fill="#3b2470" stroke="#b388ff" stroke-width="2"/>
    <rect x="-7" y="-7" width="14" height="14" fill="#3b2470"/>
  </g>
  <text x="600" y="52" text-anchor="middle" class="u" font-size="18" fill="#cbbcff" letter-spacing="2">commit more, feed the snake ♡  もっと食べたい！</text>
  <!-- tombol A B -->
  <g class="press"><circle cx="1100" cy="50" r="15" fill="#ff6fb5" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/><text x="1100" y="56" text-anchor="middle" class="u" font-size="15" fill="#ffffff">A</text></g>
  <g class="press" style="animation-delay:.8s"><circle cx="1142" cy="36" r="15" fill="#7ee8fa" stroke="#ffffff" stroke-opacity=".6" stroke-width="2"/><text x="1142" y="42" text-anchor="middle" class="u" font-size="15" fill="#1d1b2b">B</text></g>
</svg>
