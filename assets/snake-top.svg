<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee8fa"/><stop offset=".5" stop-color="#b388ff"/><stop offset="1" stop-color="#ff6fb5"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1352"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t { font-family: 'Segoe UI Black', 'Arial Black', Arial, sans-serif; font-weight: 900; }
      .u { font-family: 'Segoe UI', 'Yu Gothic', Arial, sans-serif; font-weight: 700; }
      .blink { animation: bl 1.2s steps(1) infinite; } @keyframes bl { 50% { opacity: 0 } }
      .tw { animation: tw 2s ease-in-out infinite; } @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
      .hb { animation: hb 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes hb { 0%,100% { transform: scale(1) } 15% { transform: scale(1.3) } 30% { transform: scale(1) } }
    </style>
  </defs>
  <path d="M2 88 V30 a28 28 0 0 1 28 -28 H1170 a28 28 0 0 1 28 28 V88" fill="url(#bg)" stroke="url(#b)" stroke-width="4"/>
