      <g transform="translate(40,-78) rotate(20)">
        <path d="M0 0 L-16 -10 L-16 10 Z M0 0 L16 -10 L16 10 Z" fill="#ff6fb5" stroke="#1d1b2b" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="5" fill="#ff9ad5" stroke="#1d1b2b" stroke-width="3"/>
