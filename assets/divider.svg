<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 50" width="1200" height="50">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee8fa" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#7ee8fa"/>
      <stop offset="0.5" stop-color="#b388ff"/>
      <stop offset="0.7" stop-color="#ff6fb5"/>
      <stop offset="1" stop-color="#ff6fb5" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .hb { animation: hb 1.4s ease-in-out infinite; transform-origin: 600px 25px; }
