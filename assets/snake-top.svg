  <text x="600" y="50" text-anchor="middle" class="t" font-size="30" fill="#ffffff" letter-spacing="4" filter="url(#g)">SNAKE <tspan fill="#ff9ad5">✦</tspan> スネーク</text>
  <text x="600" y="76" text-anchor="middle" class="u blink" font-size="15" fill="#7ee8fa" letter-spacing="3">▶ NOW EATING ZURA'S COMMITS</text>
  <text x="1090" y="45" text-anchor="end" class="u" font-size="16" fill="#cbbcff" letter-spacing="2">LIVES</text>
  <g fill="#ff6fb5">
    <path class="hb" d="M1112 46 c-7 -5 -10 -11 -4 -14 c3 -1 4 1 4 1 c0 0 1 -2 4 -1 c6 3 3 9 -4 14z"/>
    <path class="hb" style="animation-delay:.2s" d="M1134 46 c-7 -5 -10 -11 -4 -14 c3 -1 4 1 4 1 c0 0 1 -2 4 -1 c6 3 3 9 -4 14z"/>
    <path class="hb" style="animation-delay:.4s" d="M1156 46 c-7 -5 -10 -11 -4 -14 c3 -1 4 1 4 1 c0 0 1 -2 4 -1 c6 3 3 9 -4 14z"/>
  </g>
  <g fill="#ffd6f0">
    <path class="tw" d="M300 30 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z"/>
    <path class="tw" style="animation-delay:1s" d="M900 30 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z"/>
