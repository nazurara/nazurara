<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12062b"/>
      <stop offset="0.55" stop-color="#2a0f57"/>
      <stop offset="1" stop-color="#5b1a6e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#ff6fb5"/>
      <stop offset="1" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9ad5"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7ee8fa"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0833"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="340" rx="28"/></clipPath>
    <clipPath id="sunclip"><rect x="0" y="0" width="1200" height="232"/></clipPath>
    <clipPath id="suncircle"><circle cx="600" cy="232" r="118"/></clipPath>
    <path id="petal" d="M0 -7 C6 -7 9 0 0 8 C-9 0 -6 -7 0 -7 Z"/>
    <style>
      .tw { animation: tw 2.4s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
      .fall { animation: fall linear infinite; }
      @keyframes fall { 0% { transform: translate(0,-30px) rotate(0deg); opacity: 0 } 10% { opacity: .95 } 90% { opacity: .9 } 100% { transform: translate(-140px,380px) rotate(540deg); opacity: 0 } }
      .grid { animation: grid 1.6s linear infinite; }
      @keyframes grid { from { transform: translateY(0) } to { transform: translateY(18px) } }
      .walk { animation: walk 14s linear infinite; }
      @keyframes walk { from { transform: translateX(-120px) } to { transform: translateX(1320px) } }
      .bob { animation: bob .5s ease-in-out infinite alternate; transform-origin: 0 40px; }
      @keyframes bob { from { transform: rotate(-6deg) translateY(0) } to { transform: rotate(6deg) translateY(-3px) } }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 600px 160px; }
      @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: .9 } }
      .float { animation: float 3s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateY(0) } to { transform: translateY(-8px) } }
      .sub { font-family: 'Segoe UI', 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Noto Sans JP', Arial, sans-serif; }
      .ttl { font-family: 'Segoe UI Black', 'Arial Black', 'Arial Rounded MT Bold', Arial, sans-serif; font-weight: 900; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#sky)"/>

    <!-- bintang -->
    <g fill="#ffffff">
      <circle class="tw" cx="60" cy="40" r="2"/><circle class="tw" style="animation-delay:.4s" cx="150" cy="95" r="1.5"/>
      <circle class="tw" style="animation-delay:1.1s" cx="240" cy="30" r="2.2"/><circle class="tw" style="animation-delay:.7s" cx="330" cy="120" r="1.4"/>
      <circle class="tw" style="animation-delay:1.6s" cx="420" cy="55" r="1.8"/><circle class="tw" style="animation-delay:.2s" cx="790" cy="40" r="2"/>
      <circle class="tw" style="animation-delay:1.3s" cx="880" cy="110" r="1.5"/><circle class="tw" style="animation-delay:.9s" cx="960" cy="28" r="2.3"/>
      <circle class="tw" style="animation-delay:.5s" cx="1050" cy="85" r="1.6"/><circle class="tw" style="animation-delay:1.8s" cx="1140" cy="45" r="2"/>
      <circle class="tw" style="animation-delay:2s" cx="1110" cy="150" r="1.3"/><circle class="tw" style="animation-delay:.3s" cx="95" cy="170" r="1.3"/>
      <circle class="tw" style="animation-delay:1.5s" cx="500" cy="22" r="1.4"/><circle class="tw" style="animation-delay:.8s" cx="700" cy="18" r="1.6"/>
    </g>
    <g fill="#ffd6f0">
      <path class="tw" style="animation-delay:.6s" d="M200 150 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
      <path class="tw" style="animation-delay:1.4s" d="M1010 180 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
      <path class="tw" style="animation-delay:.1s" d="M870 60 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
      <path class="tw" style="animation-delay:1.9s" d="M310 60 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
    </g>

    <!-- matahari retro -->
    <g class="pulse">
      <circle cx="600" cy="210" r="150" fill="#ff6fb5" opacity=".35" filter="url(#softglow)"/>
    </g>
    <g clip-path="url(#sunclip)">
      <circle cx="600" cy="232" r="118" fill="url(#sun)"/>
      <g fill="#2a0f57" clip-path="url(#suncircle)">
        <rect x="470" y="170" width="260" height="5"/><rect x="470" y="186" width="260" height="7"/>
        <rect x="470" y="203" width="260" height="9"/><rect x="470" y="221" width="260" height="11"/>
      </g>
    </g>

    <!-- gunung siluet -->
    <path d="M0 232 L120 170 L210 210 L330 150 L450 232 Z" fill="#3c1361" opacity=".9"/>
    <path d="M760 232 L880 160 L980 205 L1090 150 L1200 200 L1200 232 Z" fill="#3c1361" opacity=".9"/>
    <path d="M330 150 l-22 12 10 -2 12 6 10 -6 12 2z" fill="#ffffff" opacity=".8"/>
    <path d="M1090 150 l-20 11 9 -2 11 5 10 -5 10 2z" fill="#ffffff" opacity=".8"/>

    <!-- lantai grid neon -->
    <rect x="0" y="232" width="1200" height="108" fill="url(#floor)"/>
    <line x1="0" y1="232" x2="1200" y2="232" stroke="#ff6fb5" stroke-width="3" filter="url(#glow)"/>
    <g stroke="#7ee8fa" stroke-opacity=".35" stroke-width="1.5">
      <line x1="600" y1="232" x2="600" y2="340"/>
      <line x1="600" y1="232" x2="420" y2="340"/><line x1="600" y1="232" x2="780" y2="340"/>
      <line x1="600" y1="232" x2="220" y2="340"/><line x1="600" y1="232" x2="980" y2="340"/>
      <line x1="600" y1="232" x2="0" y2="340"/><line x1="600" y1="232" x2="1200" y2="340"/>
      <line x1="600" y1="232" x2="-260" y2="340"/><line x1="600" y1="232" x2="1460" y2="340"/>
    </g>
    <g class="grid" stroke="#7ee8fa" stroke-opacity=".3" stroke-width="1.5">
      <line x1="0" y1="236" x2="1200" y2="236"/><line x1="0" y1="250" x2="1200" y2="250"/>
      <line x1="0" y1="268" x2="1200" y2="268"/><line x1="0" y1="290" x2="1200" y2="290"/>
      <line x1="0" y1="316" x2="1200" y2="316"/><line x1="0" y1="344" x2="1200" y2="344"/>
    </g>

    <!-- judul -->
    <g class="float">
      <text x="600" y="128" text-anchor="middle" class="ttl" font-size="104" fill="#ff6fb5" opacity=".6" filter="url(#softglow)">NAZURA</text>
      <text x="600" y="128" text-anchor="middle" class="ttl" font-size="104" fill="url(#title)" stroke="#2a0f57" stroke-width="3" paint-order="stroke" letter-spacing="6">NAZURA</text>
    </g>
    <text x="600" y="172" text-anchor="middle" class="sub" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="2">ようこそ ✦ Information Systems Student ✦ Game Dev</text>

    <!-- zombie kecil lucu berjalan -->
    <g class="walk">
      <g transform="translate(0,250) scale(1.5)">
        <g class="bob">
          <ellipse cx="22" cy="44" rx="16" ry="4" fill="#000" opacity=".35"/>
          <rect x="13" y="30" width="7" height="12" rx="3" fill="#3d405b"/>
          <rect x="24" y="30" width="7" height="12" rx="3" fill="#3d405b"/>
          <rect x="11" y="17" width="22" height="16" rx="5" fill="#9d4edd" stroke="#1d1b2b" stroke-width="2"/>
          <rect x="30" y="19" width="15" height="5" rx="2.5" fill="#86c06c" stroke="#1d1b2b" stroke-width="1.5"/>
          <rect x="28" y="26" width="14" height="5" rx="2.5" fill="#86c06c" stroke="#1d1b2b" stroke-width="1.5"/>
          <circle cx="22" cy="10" r="11" fill="#86c06c" stroke="#1d1b2b" stroke-width="2"/>
          <circle cx="18" cy="9" r="3.5" fill="#fff"/><circle cx="27" cy="9" r="3.5" fill="#fff"/>
          <circle cx="19" cy="9" r="1.7" fill="#d00000"/><circle cx="28" cy="9" r="1.7" fill="#d00000"/>
          <ellipse cx="15" cy="14" rx="2.5" ry="1.5" fill="#ff9ad5" opacity=".8"/><ellipse cx="30" cy="14" rx="2.5" ry="1.5" fill="#ff9ad5" opacity=".8"/>
          <path d="M19 15 q3 3 6 0" stroke="#1d1b2b" stroke-width="1.6" fill="none"/>
        </g>
      </g>
    </g>
    <g class="walk" style="animation-delay:-7s">
      <g transform="translate(0,262) scale(1.25)">
        <g class="bob" style="animation-delay:.25s">
          <ellipse cx="22" cy="44" rx="16" ry="4" fill="#000" opacity=".35"/>
          <rect x="13" y="30" width="7" height="12" rx="3" fill="#264653"/>
          <rect x="24" y="30" width="7" height="12" rx="3" fill="#264653"/>
          <rect x="11" y="17" width="22" height="16" rx="5" fill="#ff6fb5" stroke="#1d1b2b" stroke-width="2"/>
          <rect x="30" y="19" width="15" height="5" rx="2.5" fill="#a8dadc" stroke="#1d1b2b" stroke-width="1.5"/>
          <rect x="28" y="26" width="14" height="5" rx="2.5" fill="#a8dadc" stroke="#1d1b2b" stroke-width="1.5"/>
          <circle cx="22" cy="10" r="11" fill="#a8dadc" stroke="#1d1b2b" stroke-width="2"/>
          <rect x="12" y="-3" width="20" height="7" rx="3.5" fill="#ffd166" stroke="#1d1b2b" stroke-width="1.5"/>
          <circle cx="18" cy="9" r="3.5" fill="#fff"/><circle cx="27" cy="9" r="3.5" fill="#fff"/>
          <circle cx="19" cy="9" r="1.7" fill="#00b4d8"/><circle cx="28" cy="9" r="1.7" fill="#00b4d8"/>
          <ellipse cx="15" cy="14" rx="2.5" ry="1.5" fill="#ff9ad5"/><ellipse cx="30" cy="14" rx="2.5" ry="1.5" fill="#ff9ad5"/>
          <path d="M19 15 q3 3 6 0" stroke="#1d1b2b" stroke-width="1.6" fill="none"/>
        </g>
      </g>
    </g>

    <!-- kelopak sakura jatuh -->
    <g fill="#ffb7dd">
      <g transform="translate(120,0)"><use href="#petal" class="fall" style="animation-duration:9s"/></g>
      <g transform="translate(300,0)"><use href="#petal" class="fall" style="animation-duration:11s;animation-delay:-3s"/></g>
      <g transform="translate(470,0)"><use href="#petal" class="fall" style="animation-duration:10s;animation-delay:-6s"/></g>
      <g transform="translate(660,0)"><use href="#petal" class="fall" style="animation-duration:12s;animation-delay:-1s"/></g>
      <g transform="translate(830,0)"><use href="#petal" class="fall" style="animation-duration:9.5s;animation-delay:-5s"/></g>
      <g transform="translate(1000,0)"><use href="#petal" class="fall" style="animation-duration:11.5s;animation-delay:-8s"/></g>
      <g transform="translate(1170,0)"><use href="#petal" class="fall" style="animation-duration:10.5s;animation-delay:-2s"/></g>
      <g transform="translate(560,0) scale(.7)"><use href="#petal" class="fall" style="animation-duration:13s;animation-delay:-9s"/></g>
      <g transform="translate(940,0) scale(.7)"><use href="#petal" class="fall" style="animation-duration:12.5s;animation-delay:-4s"/></g>
      <g transform="translate(220,0) scale(.7)"><use href="#petal" class="fall" style="animation-duration:13.5s;animation-delay:-7s"/></g>
    </g>

    <rect width="1200" height="340" rx="28" fill="none" stroke="#ff9ad5" stroke-opacity=".5" stroke-width="3"/>
  </g>
</svg>
