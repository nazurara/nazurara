# Membuat animasi ular yang memakan kotak kontribusi GitHub
# Berjalan otomatis setiap hari jam 07.00 WIB, setiap ada push, atau manual dari tab Actions
name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ff6fb5&color_dots=#1b1335,#4a2a7a,#7c4dff,#b388ff,#ff9ad5
            dist/snake-light.svg?color_snake=#ff6fb5&color_dots=#ebedf0,#e4d4ff,#c3a6ff,#9d6bff,#ff6fb5

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
